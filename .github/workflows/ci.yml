name: Phoenix Test Automation Workflow

permissions:
  contents: write
  id-token: write
  security-events: write
  actions: read
  
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: "17 03 * * *"
  workflow_dispatch:
    inputs: 
     env:
      description: Environment
      type: choice
      options: [dev,qa,uat,prod]
      default: qa
      required: true
     suiteXmlFile: 
      description: TestNG XML FIle
      type: choice
      options: [smoke,regression,testng.xml]
      default: testng.xml
      required : true
  
jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Default values for execution
      id: default
      run: |
           echo "suiteXmlFile=${{github.event.inputs.suiteXmlFile || 'testng.xml'}}" >> $GITHUB_OUTPUT
           echo "env=${{github.event.inputs.env || 'qa'}}" >> $GITHUB_OUTPUT
           
    - name: Creating .env files
      run: |
           echo "DB_URL=${{secrets.DB_URL}}" >> .env
           echo "DB_USERNAME=${{secrets.DB_USERNAME}}" >> .env
           echo "DB_PASSWORD=${{secrets.DB_PASSWORD}}" >> .env
           
    - name: Execute Test Automation 
      run: mvn clean test -DsuiteXmlFile=$"${{ steps.default.outputs.suiteXmlFile}}" -Denv="${{ steps.default.outputs.env }}"
      
    - name: Upload a Build Artifact
      if : always()
      uses: actions/upload-artifact@v5.0.0
      with: 
       name: Surefire Reports
       path : target/surefire-reports/
       retention-days: 10

      
    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
   
